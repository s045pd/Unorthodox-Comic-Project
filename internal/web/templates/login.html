{{define "login"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIGN IN ▮ SE8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/zine.css" />
</head>
<body class="login-page">
  <article class="login-card">
    <div class="login-bar">
      <span><span class="dot"></span>&nbsp;&nbsp;SE8 // BACKEND ARCHIVE</span>
      <span>ENC · TLS · SESSION</span>
    </div>
    <div class="login-body">
      <h1 class="login-title">ACCESS<br/>GRANTED?</h1>
      <p class="login-sub">RESTRICTED PERIMETER · <b>OPERATOR ONLY</b></p>

      {{if .Error}}<div class="error-bar">{{.Error}}</div>{{end}}

      <form action="/login" method="post" class="login-fields">
        <div>
          <label for="u">Operator</label>
          <input id="u" type="text" name="username" placeholder="admin" required autofocus autocomplete="username" />
        </div>
        <div>
          <label for="p">Passphrase</label>
          <input id="p" type="password" name="password" placeholder="●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn primary" style="margin-top:6px;justify-content:center">▶ ENTER ARCHIVE</button>
      </form>

      <p class="login-foot">SE8 ▮ ED.001 ▮ NO REGISTRATION ▮ NO RECOVERY</p>
    </div>
  </article>
</body>
</html>
{{end}}
