{{define "tags_list"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>{{template "head_assets" .}}</head>
<body>
  {{template "masthead" .}}
  <main class="shell">
    <header class="page-head">
      <div>
        <p class="crumb">SECTION <b>// 03</b> · TAXONOMY</p>
        <h1>{{.Title}}<br/>CLOUD</h1>
      </div>
      <div class="meta">
        <span>UNIQUE TAGS</span>
        <b>{{len .Tags}}</b>
      </div>
    </header>

    <span class="section-label">▮ INDEXED LABELS</span>
    {{if .Tags}}
    <div class="tag-cloud">
      {{range .Tags}}
        <a class="tag" href="/books?tag={{.Name}}">{{.Name}}<em>{{.Count}}</em></a>
      {{end}}
    </div>
    {{else}}
    <div class="empty"><span class="big">∅</span>NO TAGS YET</div>
    {{end}}
  </main>
</body>
</html>
{{end}}
